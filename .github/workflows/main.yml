name: Build and Deploy Exam System

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------------------
  # 1. CI Job: Lint, Install Dependencies & Test Builds
  # ----------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Build & Test Server
      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      # Build & Test Client
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Vite Client
        run: |
          cd client
          npm run build

  # ----------------------------------------------------
  # 2. CD Job: Deploy to Server (Runs on push to main)
  # ----------------------------------------------------
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS / Cloud Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/to/online-exam-system
            git pull origin main
            docker-compose down
            docker-compose up --build -d
